<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MediReach Voice Assistant</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #e8f5f2,
                    #f5fbfa
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;

            background: white;

            border-radius: 20px;

            padding: 35px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin-top: 0;

            text-align: center;

            color: #1f6f68;
        }

        .subtitle {
            text-align: center;

            color: #666;

            margin-bottom: 30px;
        }

        .status {
            text-align: center;

            padding: 14px;

            border-radius: 10px;

            background: #f1f5f5;

            color: #555;

            margin-bottom: 25px;

            font-weight: bold;
        }

        .status.listening {
            background: #fff3cd;
            color: #856404;
        }

        .status.processing {
            background: #e8f0ff;
            color: #315da8;
        }

        .status.speaking {
            background: #dff5e9;
            color: #237044;
        }

        .status.error {
            background: #fde2e2;
            color: #a33;
        }

        .controls {
            display: flex;

            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;

            margin-bottom: 30px;
        }

        button {
            border: none;

            border-radius: 10px;

            padding: 14px 22px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        #startButton {
            background: #1f8f83;
            color: white;
        }

        #stopButton {
            background: #e6a23c;
            color: white;
        }

        #endButton {
            background: #d9534f;
            color: white;
        }

        button:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }

        .conversation {
            display: flex;

            flex-direction: column;

            gap: 15px;
        }

        .message {
            padding: 15px;

            border-radius: 12px;

            line-height: 1.5;
        }

        .user {
            background: #eef7ff;

            border-left:
                4px solid #4a90e2;
        }

        .assistant {
            background: #eefaf5;

            border-left:
                4px solid #1f8f83;
        }

        .label {
            font-weight: bold;

            margin-bottom: 5px;
        }

        .hint {
            text-align: center;

            margin-top: 20px;

            font-size: 13px;

            color: #777;
        }

    </style>
</head>


<body>

<div class="container">

    <h1>🎙️ MediReach</h1>

    <div class="subtitle">
        Your AI Medical Voice Assistant
    </div>


    <div
        id="status"
        class="status"
    >
        Ready to start
    </div>


    <div class="controls">

        <button
            id="startButton"
        >
            🎤 Start Conversation
        </button>

        <button
            id="stopButton"
            disabled
        >
            ⏹ Stop Speaking
        </button>

        <button
            id="endButton"
            disabled
        >
            🛑 End Conversation
        </button>

    </div>


    <div
        id="conversation"
        class="conversation"
    ></div>


    <div class="hint">
        Allow microphone permission when your browser asks.
    </div>

</div>


<script>

    // ============================================
    // BACKEND
    // ============================================

    const API_URL =
        "https://medical-voice-agent.onrender.com/api/chat/voice";


    // ============================================
    // ELEMENTS
    // ============================================

    const startButton =
        document.getElementById("startButton");

    const stopButton =
        document.getElementById("stopButton");

    const endButton =
        document.getElementById("endButton");

    const statusElement =
        document.getElementById("status");

    const conversationElement =
        document.getElementById("conversation");


    // ============================================
    // VARIABLES
    // ============================================

    let mediaRecorder = null;

    let audioChunks = [];

    let stream = null;

    let conversationActive = false;

    let isRecording = false;

    let currentAudio = null;

    const patientId = "3";


    // ============================================
    // STATUS
    // ============================================

    function setStatus(
        message,
        type = ""
    ) {

        statusElement.textContent = message;

        statusElement.className =
            "status " + type;
    }


    // ============================================
    // ADD MESSAGE
    // ============================================

    function addMessage(
        type,
        text
    ) {

        const message =
            document.createElement("div");

        message.className =
            `message ${type}`;


        const label =
            document.createElement("div");

        label.className = "label";


        if (type === "user") {

            label.textContent =
                "You";

        } else {

            label.textContent =
                "🤖 MediReach";

        }


        const content =
            document.createElement("div");

        content.textContent = text;


        message.appendChild(label);

        message.appendChild(content);

        conversationElement.appendChild(message);


        // Scroll to latest message

        message.scrollIntoView({
            behavior: "smooth",
            block: "nearest"
        });
    }


    // ============================================
    // START CONVERSATION
    // ============================================

    startButton.addEventListener(
        "click",
        async () => {

            try {

                stream =
                    await navigator.mediaDevices
                        .getUserMedia({
                            audio: true
                        });


                conversationActive = true;

                startButton.disabled = true;

                endButton.disabled = false;

                stopButton.disabled = false;


                setStatus(
                    "🎤 Listening...",
                    "listening"
                );


                startRecording();

            } catch (error) {

                console.error(error);

                setStatus(
                    "❌ Microphone permission denied",
                    "error"
                );

                alert(
                    "Please allow microphone permission."
                );
            }
        }
    );


    // ============================================
    // START RECORDING
    // ============================================

    function startRecording() {

        if (!conversationActive) {
            return;
        }


        if (!stream) {
            return;
        }


        audioChunks = [];


        mediaRecorder =
            new MediaRecorder(stream);


        mediaRecorder.ondataavailable =
            event => {

                if (event.data.size > 0) {

                    audioChunks.push(
                        event.data
                    );
                }
            };


        mediaRecorder.onstop =
            async () => {

                isRecording = false;

                const audioBlob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                mediaRecorder.mimeType
                        }
                    );


                await sendAudio(
                    audioBlob
                );
            };


        mediaRecorder.start();

        isRecording = true;


        setStatus(
            "🎤 Listening... Speak now",
            "listening"
        );
    }


    // ============================================
    // STOP RECORDING
    // ============================================

    stopButton.addEventListener(
        "click",
        () => {

            if (
                mediaRecorder &&
                mediaRecorder.state === "recording"
            ) {

                mediaRecorder.stop();

                setStatus(
                    "⏳ Processing...",
                    "processing"
                );
            }
        }
    );


    // ============================================
    // SEND AUDIO TO BACKEND
    // ============================================

    async function sendAudio(
        audioBlob
    ) {

        if (!conversationActive) {
            return;
        }


        try {

            setStatus(
                "⏳ AI is thinking...",
                "processing"
            );


            const formData =
                new FormData();


            formData.append(
                "patient_id",
                patientId
            );


            formData.append(
                "file",
                audioBlob,
                "speech.webm"
            );


            const response =
                await fetch(
                    API_URL,
                    {
                        method: "POST",
                        body: formData
                    }
                );


            if (!response.ok) {

                const errorText =
                    await response.text();

                throw new Error(
                    `API Error ${response.status}: ${errorText}`
                );
            }


            const data =
                await response.json();


            console.log(
                "API response:",
                data
            );


            // ========================================
            // SHOW USER TRANSCRIPT
            // ========================================

            if (data.transcript) {

                addMessage(
                    "user",
                    data.transcript
                );
            }


            // ========================================
            // SHOW AI RESPONSE
            // ========================================

            if (data.response) {

                addMessage(
                    "assistant",
                    data.response
                );
            }


            // ========================================
            // PLAY AI AUDIO
            // ========================================

            if (!data.audio) {

                throw new Error(
                    "No audio returned by backend"
                );
            }


            await playAIResponse(
                data.audio
            );


        } catch (error) {

            console.error(
                "Voice error:",
                error
            );


            setStatus(
                "❌ Something went wrong",
                "error"
            );


            if (conversationActive) {

                setTimeout(
                    () => {

                        if (conversationActive) {

                            startRecording();

                        }

                    },
                    1000
                );
            }
        }
    }


    // ============================================
    // PLAY AI RESPONSE
    // ============================================

    async function playAIResponse(
        base64Audio
    ) {

        return new Promise(
            async (resolve, reject) => {

                try {

                    setStatus(
                        "🔊 MediReach is speaking...",
                        "speaking"
                    );


                    // Base64 → binary

                    const byteCharacters =
                        atob(base64Audio);


                    const byteNumbers =
                        new Array(
                            byteCharacters.length
                        );


                    for (
                        let i = 0;
                        i < byteCharacters.length;
                        i++
                    ) {

                        byteNumbers[i] =
                            byteCharacters.charCodeAt(i);
                    }


                    const byteArray =
                        new Uint8Array(
                            byteNumbers
                        );


                    const audioBlob =
                        new Blob(
                            [byteArray],
                            {
                                type:
                                    "audio/mpeg"
                            }
                        );


                    const audioURL =
                        URL.createObjectURL(
                            audioBlob
                        );


                    currentAudio =
                        new Audio(audioURL);


                    currentAudio.preload =
                        "auto";


                    currentAudio.onended =
                        () => {

                            URL.revokeObjectURL(
                                audioURL
                            );

                            currentAudio = null;


                            resolve();


                            // Automatically
                            // listen for next question

                            if (
                                conversationActive
                            ) {

                                setTimeout(
                                    () => {

                                        startRecording();

                                    },
                                    300
                                );
                            }
                        };


                    currentAudio.onerror =
                        error => {

                            URL.revokeObjectURL(
                                audioURL
                            );

                            currentAudio = null;

                            reject(error);
                        };


                    await currentAudio.play();

                } catch (error) {

                    reject(error);
                }
            }
        );
    }


    // ============================================
    // END CONVERSATION
    // ============================================

    endButton.addEventListener(
        "click",
        () => {

            conversationActive = false;


            // Stop recording

            if (
                mediaRecorder &&
                mediaRecorder.state === "recording"
            ) {

                mediaRecorder.stop();
            }


            // Stop audio

            if (currentAudio) {

                currentAudio.pause();

                currentAudio.currentTime = 0;

                currentAudio = null;
            }


            // Stop microphone

            if (stream) {

                stream
                    .getTracks()
                    .forEach(
                        track => track.stop()
                    );

                stream = null;
            }


            startButton.disabled = false;

            stopButton.disabled = true;

            endButton.disabled = true;


            setStatus(
                "Conversation ended"
            );
        }
    );

</script>

</body>

</html>
